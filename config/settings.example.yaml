llm:
  provider: codex_exec
  deep:
    model: gpt-6.1-sol
    reasoning_effort: xhigh
  quick:
    model: gpt-6.1-sol
    reasoning_effort: medium
  call_timeout_seconds: 600
  max_retries: 3
  max_concurrent_calls: 4
  log_prompts: false

codex:
  binary:
  min_version: "0.159.3"

tradingagents:
  # 方向由研究证据决定，执行条件单独给出；条件ATR目标仍遵守原门槛。
  risk_layer_direction_lock: true
  rating_timing_decoupled: true
  price_plan_alt_target: true
  # 完整报告直接核对；legacy仅恢复研究辩论路径。
  research_manager_reads_reports: true
  debate_mode: structured
  context_compaction: true
  # 未覆盖的角色沿用默认档位；完整版给新闻分析师/研究经理/组合经理。
  context_profiles:
    news_analyst: full
    research_manager: full
    portfolio_manager: full
  output_language: Chinese
  max_debate_rounds: 1
  max_risk_discuss_rounds: 1
  # StockTwits 公共接口目前被 Cloudflare 拦截，缺省关闭；开启后照常请求，失败记为失败
  stocktwits_enabled: false
  late_news_refresh: true

context_providers:
  - market_regime
  - sector_strength
  - extended_hours
  - macro_releases
  - price_anchors

decision:
  horizon_trading_days: [5, 20]
  plan_validity_trading_days: 5

price_plan:
  stop_atr_min: 1.0
  stop_atr_normal: [1.5, 2.0]
  stop_atr_max: 2.5
  min_reward_risk: 1.5

run:
  max_parallel_tickers: 3
  max_duration_minutes: 180
  min_start_after_anchor_seconds: 60

schedule:
  anchor: "08:30 America/New_York"

futu:
  enabled: true
  host: 127.0.0.1
  port: 11111
  max_subscriptions: 40

alpaca:
  requests_per_minute: 180

# 独立评估，不改变旧五日记忆结算与反思。
evaluation:
  broad_market_etfs: [SPY, QQQ, IWM, DIA, VOO, IVV, VTI]
  settlement_windows: [5, 10, 20]
