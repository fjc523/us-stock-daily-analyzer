llm:
  provider: codex_exec
  deep:
    model: gpt-6.1-sol
    reasoning_effort: high
  quick:
    model: gpt-6.1-sol
    reasoning_effort: high
  call_timeout_seconds: 600
  max_retries: 3
  max_concurrent_calls: 4
  log_prompts: false

codex:
  binary:
  min_version: "0.159.3"

tradingagents:
  output_language: Chinese
  max_debate_rounds: 1
  max_risk_discuss_rounds: 1

context_providers:
  - market_regime
  - sector_strength
  - extended_hours
  - macro_releases

run:
  max_parallel_tickers: 3
  max_duration_minutes: 180
  min_start_after_anchor_seconds: 60

schedule:
  anchor: "08:30 America/New_York"

futu:
  enabled: true
  host: 127.0.0.1
  port: 11111
  max_subscriptions: 40

alpaca:
  requests_per_minute: 180
