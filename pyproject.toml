[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-stock-daily-analyzer"
version = "0.1.0"
description = "美股自选股与指数每日盘前分析器"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "exchange-calendars",
    "PyYAML",
    "pydantic>=2",
    "Jinja2",
    "Markdown",
    "nh3",
    "python-dotenv",
    "futu-api",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daily-analyzer = "daily_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
